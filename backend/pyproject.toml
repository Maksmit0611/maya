[project]
name = "maya-backend"
version = "0.1.0"
description = "MAYA AI API and provider adapters"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy[asyncio]>=2.0.32,<3",
  "alembic>=1.13,<2",
  "supabase>=2.7,<3",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9,<1",
  "asyncpg>=0.29,<1",
  "aiosqlite>=0.20,<1",
  "PyJWT[crypto]>=2.9,<3",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
branch = true
concurrency = ["thread"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.uv]
package = false
